name: Update public benefit stations

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-benefit-stations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-public-benefit.txt

      - name: Install parser dependencies
        run: python -m pip install --requirement scripts/requirements-public-benefit.txt

      - name: Run parser tests
        run: python -m unittest discover -s scripts/tests -p "test_public_benefit_stations.py" -v

      - name: Fetch, merge, and verify stations
        run: python scripts/update_public_benefit_stations.py

      - name: Validate generated JSON
        run: python -m json.tool utils/PublicbenefitStationNavigation/assets/data/stations.json > /dev/null

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          if git diff --quiet -- utils/PublicbenefitStationNavigation/assets/data/stations.json; then
            echo "Station snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/PublicbenefitStationNavigation/assets/data/stations.json
          git commit -m "chore: refresh public benefit stations"
          git push
