name: Update CCF deadline supplement

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ccf-deadlines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test snapshot parser
        run: python -m unittest discover -s scripts/tests -p "test_ccf_deadlines.py" -v
      - name: Test conference merge
        run: node scripts/tests/test_ccf_deadline_merge.js
      - name: Refresh snapshot
        run: python scripts/update_ccf_deadlines.py
      - name: Commit snapshot
        shell: bash
        run: |
          if git diff --quiet -- utils/CCFDDL/assets/data/ai-deadlines.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/CCFDDL/assets/data/ai-deadlines.json
          git commit -m "chore: refresh CCF deadline supplement"
          git push
